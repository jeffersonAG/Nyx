name: NYX checks
on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python API tests (no local AI required)
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.28,<1' 'sympy>=1.13,<2' 'tzdata>=2026.1' 'argon2-cffi>=23.1,<26'
          python -m unittest discover -s tests -v
      - name: Build Crimson UI
        run: |
          cd frontend
          npm install --no-audit --no-fund
          node --test src/voiceChunks.test.js
          npm run build
      - name: Validate compose
        run: docker compose config --quiet
